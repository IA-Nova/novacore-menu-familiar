name: Comprobar cambios

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - run: npm run test:unit
      - run: npx firebase emulators:exec --only firestore --project demo-novacore-menu-familiar "npm run test:rules"
      - run: npm run check:production
      - run: npm run build
